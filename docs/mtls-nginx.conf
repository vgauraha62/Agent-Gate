# Nginx mTLS Configuration for AgentGate External TLS Mode
# =============================================================
#
# This configuration sets up nginx as a reverse proxy with mTLS.
# nginx terminates TLS and passes client certificate info to AgentGate
# via HTTP headers.
#
# Architecture:
#   [Agent with client cert] --mTLS--> [nginx:8443] --HTTP+Headers--> [AgentGate:8080]
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/agentgate-mtls
#   2. Link to /etc/nginx/sites-enabled/agentgate-mtls
#   3. Adjust certificate paths as needed
#   4. Reload nginx: nginx -s reload

# Upstream backend (AgentGate HTTP server)
upstream agentgate_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTPS server with mTLS
server {
    listen 8443 ssl http2;
    server_name agentgate.example.com;

    # ============================================================
    # SSL/TLS Configuration
    # ============================================================

    # Server certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # mTLS: Require client certificate
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling (optional but recommended)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ============================================================
    # Security Headers
    # ============================================================

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # ============================================================
    # Client Certificate Headers (Passed to AgentGate)
    # ============================================================
    #
    # IMPORTANT: We pass the FULL PEM certificate because:
    # 1. $ssl_client_fingerprint in nginx is SHA1 (40 hex chars), not SHA256
    # 2. AgentGate computes SHA256 from PEM (works on ALL nginx versions)
    # 3. This is more reliable than depending on specific nginx variables

    location / {
        # SSL verification result (SUCCESS or FAILED) - REQUIRED
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;

        # Full PEM certificate - AgentGate computes SHA256 from this
        # This is the PRIMARY method (works on all nginx versions)
        proxy_set_header X-SSL-Client-Cert $ssl_client_cert;

        # SHA1 fingerprint (40 hex chars) - optional fallback
        # Note: This is SHA1, not SHA256. Use for compatibility.
        proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;

        # Optional: Certificate serial number
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

        # Optional: Subject Common Name
        # Note: nginx doesn't have $ssl_client_s_dn_cn, use $ssl_client_s_dn and extract CN manually
        # For now, we'll just pass the full subject DN
        proxy_set_header X-SSL-Client-Subject $ssl_client_s_dn;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy configuration
        proxy_pass http://agentgate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (no client cert required for monitoring)
    location /health {
        proxy_pass http://agentgate_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# HTTP to HTTPS redirect (optional)
server {
    listen 8080;
    server_name agentgate.example.com;
    return 301 https://$server_name:8443$request_uri;
}